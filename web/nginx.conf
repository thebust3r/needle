server {
    listen 80;
    root /usr/share/nginx/html;

    # Music, art and library requests go straight to Navidrome on the NAS.
    # Same address as the page, so the browser needs no extra setup.
    location /rest/ {
        proxy_pass http://192.168.1.168:4533;
        proxy_http_version 1.1;
        proxy_buffering off;          # stream songs as they arrive
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
