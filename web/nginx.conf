server {
    listen 80;
    root /app/site;

    # music, art and library requests go straight to Navidrome on the NAS
    location /rest/ {
        proxy_pass http://192.168.1.168:4533;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # synced lyrics from LRCLIB, fetched by the NAS (works even if the phone can't reach it)
    location ~ ^/lrclib/(.*)$ {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        proxy_pass https://lrclib.net/$1$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host lrclib.net;
        proxy_set_header User-Agent "Needle web player (personal, self-hosted)";
        proxy_read_timeout 20s;
    }

    # playlist import helper (needle-helper container in the same project)
    location /helper/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $helper http://needle-helper:8790;
        proxy_pass $helper;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
        add_header Cache-Control "no-store";
    }
    location ~ \.py$ { return 404; }

    location = /version.txt { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
