<main id="view"></main>

<div id="dock">
  <div id="mini" hidden>
    <img class="art" alt="">
    <div class="meta"><b></b><span></span></div>
    <button id="mini-play" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button>
    <button id="mini-next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
    <div class="prog"><i></i></div>
  </div>
  <nav id="tabs">
    <a href="#/" data-tab="home"><svg class="i"><use href="#i-home"/></svg>Home</a>
    <a href="#/library" data-tab="library"><svg class="i"><use href="#i-library"/></svg>Library</a>
    <a href="#/search" data-tab="search"><svg class="i"><use href="#i-search"/></svg>Search</a>
    <a href="#/settings" data-tab="settings"><svg class="i"><use href="#i-sliders"/></svg>Settings</a>
  </nav>
</div>

<section id="np" hidden aria-label="Now playing">
  <div class="backdrop"><img alt=""></div>
  <div class="wash"></div>
  <canvas class="glow"></canvas>
  <div class="np-top">
    <button id="np-close" aria-label="Close"><svg class="i"><use href="#i-down"/></svg></button>
    <div><small>Playing from</small><b id="np-album"></b></div>
    <button id="np-more" aria-label="More"><svg class="i"><use href="#i-more"/></svg></button>
  </div>
  <div class="np-art-wrap">
    <div class="np-stage" id="np-stage" role="button" tabindex="0" aria-label="Album art. Tap to show the visualizer">
      <img class="np-art" alt="">
      <canvas id="viz" class="np-viz" aria-hidden="true"></canvas>
      <div class="vinyl" id="vinyl" hidden role="slider" aria-label="Record. Drag around it to scratch, hold it to stop, spin it to skip" aria-valuetext="">
        <div class="vinyl-disc"><img class="vinyl-label" alt=""><span class="vinyl-hole"></span></div>
        <svg class="tonearm" viewBox="0 0 60 200" aria-hidden="true"><circle cx="40" cy="22" r="14"/><circle cx="40" cy="22" r="5" class="pivot"/><path d="M40 22 L36 150 L18 178"/><rect x="8" y="170" width="20" height="26" rx="3" transform="rotate(28 18 183)"/></svg>
      </div>
      <div class="viz-flash" aria-hidden="true"></div>
      <div class="viz-ui">
        <button id="viz-mode" class="viz-chip" aria-label="Change visualizer style">Auto</button>
        <span class="viz-right">
          <button id="viz-custom" class="viz-btn" aria-label="Customize the visualizer"><svg class="i"><use href="#i-sliders"/></svg></button>
          <button id="viz-full" class="viz-btn" aria-label="Full-screen visualizer"><svg class="i"><use href="#i-expand"/></svg></button>
        </span>
      </div>
    </div>
    <div class="lyrics" id="lyrics" hidden><div class="lyrics-body" id="lyrics-body"></div></div>
  </div>
  <div class="np-title">
    <div><h2 id="np-title"></h2><button id="np-artist" class="np-artist"></button></div>
    <button id="np-heart" class="heart" aria-label="Favorite"><svg class="i"><use href="#i-heart"/></svg></button>
  </div>
  <div class="scrub">
    <input id="np-seek" type="range" min="0" max="1000" value="0" aria-label="Song position">
    <div class="times"><span id="np-cur">0:00</span><span id="np-left">-0:00</span></div>
  </div>
  <div class="np-pads" id="np-pads" hidden role="group" aria-label="Live chops">
    <button data-move="loop" aria-label="Repeat the last beat. Hold to loop it"><b>Repeat</b><small>hold = loop</small></button>
    <button data-move="stutter" aria-label="Stutter"><b>Stutter</b><small>ch-ch-ch</small></button>
    <button data-move="doubleUp" aria-label="Double up"><b>Double</b><small>beat ×2</small></button>
    <button data-move="runBack" aria-label="Run it back"><b>Run back</b><small>2 beats</small></button>
    <button data-move="backItUp" aria-label="Back it up"><b>Back up</b><small>a bar</small></button>
  </div>
  <div class="controls">
    <button id="np-shuffle" class="small" aria-label="Shuffle"><svg class="i"><use href="#i-shuffle"/></svg></button>
    <button id="np-prev" aria-label="Previous"><svg class="i"><use href="#i-prev"/></svg></button>
    <button id="np-play" class="big" aria-label="Play or pause"><svg class="i"><use href="#i-play"/></svg></button>
    <button id="np-next" aria-label="Next"><svg class="i"><use href="#i-next"/></svg></button>
    <button id="np-repeat" class="small" aria-label="Repeat"><svg class="i"><use href="#i-repeat"/></svg></button>
  </div>
  <div class="np-bottom">
    <button id="np-eq" class="chip"><svg class="i"><use href="#i-sliders"/></svg><span>EQ</span></button>
    <button id="np-screw" class="chip screw-chip" aria-label="Slowed and chopped"><svg class="i"><use href="#i-turtle"/></svg><span></span></button>
    <div class="np-right">
      <button id="np-lyrics" aria-label="Lyrics" aria-pressed="false"><svg class="i"><use href="#i-lyrics"/></svg></button>
      <button id="np-queue" aria-label="Queue"><svg class="i"><use href="#i-list"/></svg></button>
    </div>
  </div>
</section>

<section id="vizfull" hidden aria-label="Full-screen visualizer">
  <canvas id="viz-big" aria-hidden="true"></canvas>
  <div class="viz-flash" aria-hidden="true"></div>
  <div class="vf-top">
    <button id="vf-close" class="viz-btn" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button>
    <span class="vf-styles">
      <button id="vf-prev" class="viz-btn" aria-label="Previous style"><svg class="i"><use href="#i-back"/></svg></button>
      <button id="vf-mode" class="viz-chip">Auto</button>
      <button id="vf-next" class="viz-btn" aria-label="Next style"><svg class="i"><use href="#i-chev"/></svg></button>
    </span>
    <button id="vf-custom" class="viz-btn" aria-label="Customize the visualizer"><svg class="i"><use href="#i-sliders"/></svg></button>
  </div>
  <p class="vf-tip" id="vf-tip">Drag to swirl · tap for a burst</p>
  <div class="vf-bottom"><b id="vf-title"></b><span id="vf-artist"></span></div>
</section>
<section id="eq" class="sheet" hidden aria-label="Equalizer"></section>
<section id="queue" class="sheet" hidden aria-label="Queue"></section>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<input id="file-pick" type="file" accept="audio/*" multiple hidden>

<script src="md5.js"></script>
<script src="app.js"></script>
<script src="viz.js"></script>
<script src="viz-ui.js"></script>
<script src="lyrics.js"></script>
<script src="turntable.js"></script>
<script src="import.js"></script>
<script src="mixes.js"></script>
</body>
</html>
