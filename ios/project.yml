name: Needle
options:
  bundleIdPrefix: com.thebust3r
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.11"
    CURRENT_PROJECT_VERSION: "12"
targets:
  Needle:
    type: application
    platform: iOS
    sources:
      - Needle
    scheme:
      testTargets:
        - NeedleTests
    info:
      path: Needle/Info.plist
      properties:
        CFBundleDisplayName: Platter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebust3r.needle
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_PREVIEWS: "NO"

  NeedleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NeedleTests
    dependencies:
      - target: Needle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.thebust3r.needle.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Needle.app/Needle
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGNING_ALLOWED: "NO"
