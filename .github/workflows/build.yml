name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Test in an iPhone simulator
        shell: bash
        run: |
          set +e
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEVICE"
          xcodebuild test -project ios/Needle.xcodeproj -scheme Needle -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath testbuild CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          # results show up as notes on the run
          summary=$(grep -E "Executed [0-9]+ tests?" test.log | tail -1 | sed 's/^[[:space:]]*//')
          echo "::notice title=App tests::${summary:-no summary (see errors)}"
          grep -o "METRIC .*" test.log | sort -u > metrics.txt
          if [ -s metrics.txt ]; then
            split -l 20 metrics.txt mpart_
            for f in mpart_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::notice title=Benchmarks $f::$msg"; done
          fi
          grep -E "error:|Test Case .* failed" test.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > failures.txt
          if [ -s failures.txt ]; then
            split -l 12 failures.txt fpart_
            for f in fpart_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::error title=Test failures $f::$msg"; done
          fi
          exit $status

      - name: Build (Sideloadly or AltStore signs it with your Apple ID)
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Needle.xcodeproj -scheme Needle -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # report compile errors as readable notes on the run
            grep -E ": error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > errors.txt
            [ -s errors.txt ] || tail -60 build.log > errors.txt
            split -l 12 errors.txt part_
            n=0
            for f in part_*; do
              n=$((n+1))
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Build errors $n::$msg"
            done
          fi
          exit $status

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Needle.app Payload/
          # placeholder ("ad-hoc") signature so Sideloadly/AltStore can re-sign it with your Apple ID
          codesign --force --deep --sign - Payload/Needle.app
          codesign --verify --verbose Payload/Needle.app
          zip -qry Needle.ipa Payload

      - name: Inspect app package
        shell: bash
        run: |
          {
            echo "FILES:"; (cd Payload && find . -type f | sort | head -60)
            echo "BINARIES:"; find Payload -type f -perm +111 -exec file {} \;
            echo "SIGNATURE:"; codesign -dvvv Payload/Needle.app 2>&1 | head -25
            echo "ENTITLEMENTS:"; codesign -d --entitlements - Payload/Needle.app 2>&1 | head -20
            echo "PLIST:"; plutil -p Payload/Needle.app/Info.plist | head -60
          } > inspect.txt
          split -l 25 inspect.txt part_
          for f in part_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::notice title=Inspect $f::$msg"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Needle-ipa
          path: Needle.ipa
