name: Build iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Sideloadly or AltStore signs it with your Apple ID)
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Needle.xcodeproj -scheme Needle -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # report compile errors as readable notes on the run
            grep -E ": error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > errors.txt
            [ -s errors.txt ] || tail -60 build.log > errors.txt
            split -l 12 errors.txt part_
            n=0
            for f in part_*; do
              n=$((n+1))
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Build errors $n::$msg"
            done
          fi
          exit $status

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Needle.app Payload/
          # placeholder ("ad-hoc") signature so Sideloadly/AltStore can re-sign it with your Apple ID
          codesign --force --deep --sign - Payload/Needle.app
          codesign --verify --verbose Payload/Needle.app
          zip -qry Needle.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Needle-ipa
          path: Needle.ipa
