name: Build iPhone app

# Mac build minutes count 10x against the free allowance, so: only build when the app changed, cancel a build that a
# newer push replaces, and run the (slower) tests only when a commit message says [test] or when started by hand.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      tests:
        description: "Run the app tests too"
        type: boolean
        default: true
      ui:
        description: "Run the UI tests and publish screenshots"
        type: boolean
        default: true

permissions:
  contents: write     # the UI tests publish their screenshots to the ci-screenshots branch

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      RUN_TESTS: ${{ (github.event_name == 'workflow_dispatch' && inputs.tests) || contains(github.event.head_commit.message, '[test]') }}
      RUN_UI: ${{ (github.event_name == 'workflow_dispatch' && inputs.ui) || contains(github.event.head_commit.message, '[ui]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Test in an iPhone simulator
        if: env.RUN_TESTS == 'true'
        shell: bash
        run: |
          set +e
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEVICE"
          xcodebuild test -project ios/Needle.xcodeproj -scheme Needle -configuration Debug -only-testing:NeedleTests \
            -destination "id=$DEVICE" -derivedDataPath testbuild CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          status=$?
          # results show up as notes on the run
          summary=$(grep -E "Executed [0-9]+ tests?" test.log | tail -1 | sed 's/^[[:space:]]*//')
          echo "::notice title=App tests::${summary:-no summary (see errors)}"
          grep -o "METRIC .*" test.log | sort -u > metrics.txt
          if [ -s metrics.txt ]; then
            split -l 20 metrics.txt mpart_
            for f in mpart_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::notice title=Benchmarks $f::$msg"; done
          fi
          grep -E "error:|Test Case .* failed" test.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > failures.txt
          if [ -s failures.txt ]; then
            split -l 12 failures.txt fpart_
            for f in fpart_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::error title=Test failures $f::$msg"; done
          fi
          exit $status

      - name: UI tests on a simulator, with screenshots
        if: env.RUN_UI == 'true'
        shell: bash
        run: |
          set +e
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet --user pillow
          PORT=8796 python3 web/tests/fake_server.py web/site > fake.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8796/rest/ping && break; sleep 1; done
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone 1[5-7]( Pro)? \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "Simulator: $DEVICE"
          mkdir -p "$PWD/shots"
          TEST_RUNNER_SHOT_DIR="$PWD/shots" TEST_RUNNER_UITEST_SERVER="http://127.0.0.1:8796" \
          xcodebuild test -project ios/Needle.xcodeproj -scheme Needle -configuration Debug -only-testing:NeedleUITests \
            -destination "id=$DEVICE" -derivedDataPath uibuild CODE_SIGNING_ALLOWED=NO > ui.log 2>&1
          status=$?
          summary=$(grep -E "Executed [0-9]+ tests?" ui.log | tail -1 | sed 's/^[[:space:]]*//')
          echo "::notice title=UI tests::${summary:-no summary (see errors)} · $(ls shots | wc -l | tr -d ' ') screenshots"
          grep -E "error:|Test Case .* failed|XCTAssert" ui.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40 > uifail.txt
          if [ -s uifail.txt ]; then
            split -l 10 uifail.txt upart_
            for f in upart_*; do msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}'); echo "::error title=UI test failures $f::$msg"; done
          fi
          # publish the screenshots (latest run only) so they can be looked at
          if [ -n "$(ls shots)" ]; then
            cd shots
            git init -q && git checkout -q -b ci-screenshots
            git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7} (status $status)"
            git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
            cd ..
          fi
          exit $status

      - name: Build (Sideloadly or AltStore signs it with your Apple ID)
        shell: bash
        run: |
          set +e
          xcodebuild -project ios/Needle.xcodeproj -scheme Needle -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # report compile errors as readable notes on the run
            grep -E ": error:" build.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u > errors.txt
            [ -s errors.txt ] || tail -60 build.log > errors.txt
            split -l 12 errors.txt part_
            n=0
            for f in part_*; do
              n=$((n+1))
              msg=$(sed 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Build errors $n::$msg"
            done
          fi
          exit $status

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Needle.app Payload/
          # placeholder ("ad-hoc") signature so Sideloadly/AltStore can re-sign it with your Apple ID
          codesign --force --deep --sign - Payload/Needle.app
          codesign --verify --verbose Payload/Needle.app
          zip -qry Needle.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Needle-ipa
          path: Needle.ipa
